<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913" />
      <stop offset="50%" stop-color="#0f1424" />
      <stop offset="100%" stop-color="#0a0c18" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="neonMagenta" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0844" />
      <stop offset="100%" stop-color="#ffb199" />
    </linearGradient>

    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b224ef" />
      <stop offset="100%" stop-color="#7579ff" />
    </linearGradient>

    <linearGradient id="waveformGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="35%" stop-color="#7579ff" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#ff0844" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glowing filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.35; }
      50% { transform: scale(1.18) translate(15px, -10px); opacity: 0.65; }
    }
    @keyframes waveOscillate {
      0% { transform: scaleY(0.7) translateY(15px); }
      50% { transform: scaleY(1.15) translateY(-10px); }
      100% { transform: scaleY(0.7) translateY(15px); }
    }
    @keyframes spectrumBounce {
      0%, 100% { transform: scaleY(0.2); }
      50% { transform: scaleY(1); }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes flowDashes {
      to { stroke-dashoffset: -200; }
    }
    .orb-1 {
      animation: pulseOrb 8s ease-in-out infinite alternate;
      transform-origin: 200px 100px;
    }
    .orb-2 {
      animation: pulseOrb 10s ease-in-out infinite alternate-reverse;
      transform-origin: 1000px 300px;
    }
    .wave-line-1 {
      animation: waveOscillate 6s ease-in-out infinite;
      transform-origin: 600px 310px;
    }
    .wave-line-2 {
      animation: waveOscillate 8s ease-in-out infinite reverse;
      transform-origin: 600px 310px;
    }
    .pill-anim {
      animation: floatPill 5s ease-in-out infinite;
    }
    .grid-lines {
      stroke: #ffffff;
      stroke-opacity: 0.04;
      stroke-width: 1;
    }
  </style>

  <!-- Base Canvas -->
  <rect width="1200" height="400" rx="16" fill="url(#bgGrad)" />

  <!-- Grid Overlay -->
  <g class="grid-lines">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="150" y1="0" x2="150" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="450" y1="0" x2="450" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="750" y1="0" x2="750" y2="400" />
    <line x1="900" y1="0" x2="900" y2="400" />
    <line x1="1050" y1="0" x2="1050" y2="400" />
  </g>

  <!-- Ambient Dynamic Glowing Orbs in Background -->
  <circle class="orb-1" cx="220" cy="110" r="180" fill="url(#neonPurple)" filter="url(#glow)" />
  <circle class="orb-2" cx="980" cy="280" r="170" fill="url(#neonCyan)" filter="url(#glow)" />

  <!-- Animated Soundwave Elements in Lower Half -->
  <g opacity="0.65">
    <!-- Waveform Path 1 -->
    <path class="wave-line-1" d="M 0 310 Q 150 250, 300 310 T 600 310 T 900 310 T 1200 310" 
          fill="none" stroke="url(#waveformGrad)" stroke-width="3" filter="url(#glow)" />
    <!-- Waveform Path 2 (Complex harmonics) -->
    <path class="wave-line-2" d="M 0 320 C 100 270, 200 360, 350 320 C 500 280, 650 350, 800 310 C 950 270, 1080 340, 1200 320" 
          fill="none" stroke="url(#neonCyan)" stroke-width="2" stroke-dasharray="8 6" style="animation: flowDashes 15s linear infinite;" />
  </g>

  <!-- Audio Spectrum Visualizer Bars (Subtle Footer Animation) -->
  <g opacity="0.45" transform="translate(60, 375)">
    <rect x="0" y="-30" width="6" height="30" rx="3" fill="#00f2fe" style="animation: spectrumBounce 1.2s ease-in-out infinite alternate; transform-origin: bottom;" />
    <rect x="14" y="-45" width="6" height="45" rx="3" fill="#7579ff" style="animation: spectrumBounce 0.9s ease-in-out infinite alternate; transform-origin: bottom;" />
    <rect x="28" y="-20" width="6" height="20" rx="3" fill="#ff0844" style="animation: spectrumBounce 1.4s ease-in-out infinite alternate; transform-origin: bottom;" />
    <rect x="42" y="-55" width="6" height="55" rx="3" fill="#00f2fe" style="animation: spectrumBounce 0.8s ease-in-out infinite alternate; transform-origin: bottom;" />
    <rect x="56" y="-35" width="6" height="35" rx="3" fill="#b224ef" style="animation: spectrumBounce 1.1s ease-in-out infinite alternate; transform-origin: bottom;" />
    <rect x="70" y="-50" width="6" height="50" rx="3" fill="#4facfe" style="animation: spectrumBounce 1.3s ease-in-out infinite alternate; transform-origin: bottom;" />
    <rect x="84" y="-25" width="6" height="25" rx="3" fill="#ffb199" style="animation: spectrumBounce 0.7s ease-in-out infinite alternate; transform-origin: bottom;" />
    <rect x="98" y="-40" width="6" height="40" rx="3" fill="#7579ff" style="animation: spectrumBounce 1.0s ease-in-out infinite alternate; transform-origin: bottom;" />
  </g>

  <g opacity="0.45" transform="translate(1030, 375)">
    <rect x="0" y="-35" width="6" height="35" rx="3" fill="#00f2fe" style="animation: spectrumBounce 1.1s ease-in-out infinite alternate; transform-origin: bottom;" />
    <rect x="14" y="-50" width="6" height="50" rx="3" fill="#7579ff" style="animation: spectrumBounce 0.85s ease-in-out infinite alternate; transform-origin: bottom;" />
    <rect x="28" y="-25" width="6" height="25" rx="3" fill="#ff0844" style="animation: spectrumBounce 1.3s ease-in-out infinite alternate; transform-origin: bottom;" />
    <rect x="42" y="-40" width="6" height="40" rx="3" fill="#00f2fe" style="animation: spectrumBounce 0.75s ease-in-out infinite alternate; transform-origin: bottom;" />
    <rect x="56" y="-60" width="6" height="60" rx="3" fill="#b224ef" style="animation: spectrumBounce 1.2s ease-in-out infinite alternate; transform-origin: bottom;" />
    <rect x="70" y="-30" width="6" height="30" rx="3" fill="#4facfe" style="animation: spectrumBounce 0.95s ease-in-out infinite alternate; transform-origin: bottom;" />
  </g>

  <!-- FOREGROUND CONTENT: Header Tag, Title, Subtitle, Badges (Solid Foreground Z-Index) -->
  <g id="foreground-content">
    <!-- Category Pill -->
    <g transform="translate(60, 48)">
      <rect width="210" height="32" rx="16" fill="#141c33" stroke="#00f2fe" stroke-width="1.2" opacity="0.95" />
      <circle cx="18" cy="16" r="5" fill="#00f2fe" filter="url(#softGlow)" />
      <text x="34" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#00f2fe" letter-spacing="1.5">AWESOME SOUND DSP</text>
    </g>

    <!-- Title -->
    <text x="60" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      Creative Audio &amp; Sound Design
    </text>
    <text x="60" y="182" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" fill="url(#waveformGrad)" letter-spacing="-0.5">
      Synthesizer Ecosystem
    </text>

    <!-- Subtitle -->
    <text x="60" y="224" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
      Curated directory of flagship wavetable, FM &amp; modular synthesizers, DSP engines, and VST3/CLAP instruments.
    </text>

    <!-- Feature Feature Tag Badges -->
    <g class="pill-anim" transform="translate(60, 260)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="130" height="34" rx="8" fill="#18223d" stroke="#334155" stroke-width="1" />
        <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#38bdf8">⚡ Wavetable</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(142, 0)">
        <rect width="138" height="34" rx="8" fill="#18223d" stroke="#334155" stroke-width="1" />
        <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#a78bfa">🎛️ FM &amp; Modular</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(292, 0)">
        <rect width="130" height="34" rx="8" fill="#18223d" stroke="#334155" stroke-width="1" />
        <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#fb7185">🎹 VST3 / CLAP</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(434, 0)">
        <rect width="144" height="34" rx="8" fill="#18223d" stroke="#334155" stroke-width="1" />
        <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#34d399">🔬 Audio DSP</text>
      </g>
    </g>
  </g>
</svg>
